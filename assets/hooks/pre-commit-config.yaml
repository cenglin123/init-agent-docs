# Sample .pre-commit-config.yaml for projects using the pre-commit framework
# (https://pre-commit.com/). Copy to repo root and run `pre-commit install`.
# Uncomment the stack-specific section(s) your project needs.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -X utf8 -m pip install --upgrade pytest

      - name: Configure git identity for test fixtures
        run: |
          git config --global user.name "ci-test"
          git config --global user.email "ci-test@example.invalid"

      - name: Check whitespace across event commit range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE" ]; then
            git diff --check "${PR_BASE}..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            git diff --check "${PUSH_BEFORE}..HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1..HEAD
          else
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi

      - name: Run source governance gate (R2)
        run: python -X utf8 scripts/check_source.py

      - name: Run full test suite
        run: python -X utf8 -m pytest tests/ assets/scripts/test_worktree_task.py -q
